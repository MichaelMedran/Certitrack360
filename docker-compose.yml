services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: certitrack
      POSTGRES_USER: certitrack
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DB_ENGINE: postgres
    depends_on: [db]
    ports: ["8000:8000"]
  alertas:  # genera las notificaciones de vencimiento cada hora
    build: .
    env_file: .env
    environment:
      DB_ENGINE: postgres
    depends_on: [web]
    command: sh -c "while true; do python manage.py generar_alertas; sleep 3600; done"
  ollama:  # solo fase 2 (chatbot); si no está activo, el resto de la app funciona igual
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
volumes:
  pgdata:
  ollama:
