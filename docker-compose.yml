# CertiTrack 360 — todo corre en la red local (SDD §18). Uso:
#   copy .env.example .env   (y cambie las claves)
#   docker compose up --build
#   docker compose exec web python manage.py seed_demo      (datos simulados)
#   docker compose exec ollama ollama pull llama3.2:3b && docker compose exec ollama ollama pull nomic-embed-text   (fase 2)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: certitrack
      POSTGRES_USER: certitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certitrack -d certitrack"]
      interval: 5s
      retries: 20

  web:
    build: .
    image: certitrack360
    env_file: .env
    environment:
      DATABASE_URL: postgres://certitrack:${POSTGRES_PASSWORD}@db:5432/certitrack
      OLLAMA_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media   # archivos adjuntos: respaldar junto con la base de datos

  programador:  # alertas de vencimiento (cada hora) e indexación de lecciones (a diario)
    image: certitrack360
    env_file: .env
    environment:
      DATABASE_URL: postgres://certitrack:${POSTGRES_PASSWORD}@db:5432/certitrack
      OLLAMA_URL: http://ollama:11434
    command: sh -c "python manage.py esperar_bd --migrado && python manage.py programador"
    depends_on:
      - web

  ollama:  # solo fase 2. Sin puertos publicados: únicamente la web lo alcanza, por la red interna de Compose.
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  media:
  ollama:
