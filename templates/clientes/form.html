{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{% if objeto %}Editar{% else %}Nuevo{% endif %} {{ singular }}</h1>
<form method="post" class="tarjeta">{% csrf_token %}
  {{ form.as_p }}
  <button class="boton">Guardar</button>
  <a class="boton sec" href="{% url 'adm_lista' entidad %}">Cancelar</a>
</form>
{% endblock %}
